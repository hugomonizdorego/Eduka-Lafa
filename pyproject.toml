[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lafa-assistant"
dynamic = ["version"]
description = "Lafa: encyclopedia of Timor-Leste and virtual assistant for Edukasaun OS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hugo Moniz do Rego"}]
# Debian/Edukasaun OS: the .deb uses python3-pyqt5. pip installs use PySide6.
dependencies = ["PySide6>=6.6,<7"]

[project.scripts]
lafa = "lafa.app:main"

[tool.setuptools.dynamic]
version = {attr = "lafa.__version__"}

[tool.setuptools.packages.find]
include = ["lafa*"]

[tool.setuptools.package-data]
lafa = ["assets/*.png", "assets/*.json", "assets/fonts/*", "assets/icons/*", "assets/illustrations/*", "assets/timor/*.json", "assets/timor/*/*.json", "assets/timor/*/*.md"]
